services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_assistant
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_assistant"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hr:hr@db:5432/hr_assistant
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python -m scripts.migrate &&
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
