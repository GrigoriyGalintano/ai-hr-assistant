[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hr-assistant"
version = "0.1.0"
description = "HR assistant backend: vacancies and GigaChat integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
